<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Link preview card</title>
<!--
  Source for public/og.png — the image LinkedIn, WhatsApp and X show
  when the site is shared. Regenerate with:

      python tools/make-og.py

  1200x630 is the size every platform crops from. Everything that has
  to survive is kept clear of the outer 60px, because feeds crop the
  edges at some aspect ratios.
-->
<style>
  @font-face { font-family: "Thmanyah Display"; font-weight: 300;
    src: url("../public/fonts/thmanyahserifdisplay-Light.woff2") format("woff2"); }
  @font-face { font-family: "Thmanyah Display"; font-weight: 700;
    src: url("../public/fonts/thmanyahserifdisplay-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Thmanyah Sans"; font-weight: 400;
    src: url("../public/fonts/thmanyahsans-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Thmanyah Sans"; font-weight: 500;
    src: url("../public/fonts/thmanyahsans-Medium.woff2") format("woff2"); }
  @font-face { font-family: "Thmanyah Serif"; font-weight: 300;
    src: url("../public/fonts/thmanyahseriftext-Light.woff2") format("woff2"); }

  :root {
    --ground: #FBF8F3;
    --ink: #17151C;
    --ink-soft: #57525F;
    --ink-faint: #8B8593;
    --accent: #6C4CF0;
    --accent-soft: #B7A4FF;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 76px 84px;
    background:
      radial-gradient(70% 90% at 8% 108%,
        color-mix(in oklab, var(--accent) 26%, transparent), transparent 70%),
      radial-gradient(60% 80% at 96% -10%,
        color-mix(in oklab, var(--accent-soft) 34%, transparent), transparent 68%),
      var(--ground);
    color: var(--ink);
    font-family: "Thmanyah Sans", system-ui, sans-serif;
  }


  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 0.16em;
    color: var(--ink-faint);
    margin-bottom: 26px;
  }
  .eyebrow i {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
  }

  h1 {
    font-family: "Thmanyah Display", Georgia, serif;
    font-weight: 300;
    font-size: 104px;
    line-height: 1.08;
    letter-spacing: -0.035em;
    margin-bottom: 28px;
  }
  h1 b { font-weight: 700; font-style: italic; color: var(--accent); }

  p {
    font-family: "Thmanyah Serif", Georgia, serif;
    font-weight: 300;
    font-size: 30px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 27ch;
    margin-bottom: 44px;
  }

  .foot {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .domain {
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--accent);
    direction: ltr;
  }
  .rule {
    flex: 1;
    height: 1px;
    background: color-mix(in oklab, var(--accent) 28%, transparent);
  }
  .en {
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    direction: ltr;
  }
</style>
</head>
<body>

<div class="eyebrow"><i></i> داخل عالم مها</div>

<h1>مرحبًا، أنا <b>مها.</b></h1>

<p>مهندسة حاسب شغوفة بالذكاء الاصطناعي التوليدي والوكلاء الأذكياء.</p>

<div class="foot">
  <span class="domain">mahaalrashdi.com</span>
  <span class="rule"></span>
  <span class="en">MAHA ALRASHDI</span>
</div>

</body>
</html>
