<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Invite card</title>
<!--
  Source for public/invite.png — the dark invitation card.

  Palette is the site's own dark theme, copied from the
  [data-theme="dark"] block in src/styles/tokens.css, so the card and
  the site in dark mode are the same object.

  The page is LTR because the English headline leads; the Arabic line
  carries dir="rtl" on itself so its punctuation sits correctly.
-->
<style>
  @font-face { font-family: "Thmanyah Display"; font-weight: 300;
    src: url("../public/fonts/thmanyahserifdisplay-Light.woff2") format("woff2"); }
  @font-face { font-family: "Thmanyah Display"; font-weight: 700;
    src: url("../public/fonts/thmanyahserifdisplay-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Thmanyah Sans"; font-weight: 500;
    src: url("../public/fonts/thmanyahsans-Medium.woff2") format("woff2"); }
  @font-face { font-family: "Thmanyah Sans"; font-weight: 700;
    src: url("../public/fonts/thmanyahsans-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Thmanyah Serif"; font-weight: 300;
    src: url("../public/fonts/thmanyahseriftext-Light.woff2") format("woff2"); }

  /* the site's dark theme, verbatim */
  :root {
    --ground:       #131019;
    --ground-deep:  #0D0B12;
    --ink:          #F4F0F7;
    --ink-soft:     #A9A2B6;
    --ink-faint:    #6E677C;
    --silver-faint: #262130;
    --accent:       #A88CFF;
    --accent-soft:  #7C5CE0;
    --accent-ink:   #17151C;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 90px;
    background:
      radial-gradient(62% 46% at 50% 4%,
        color-mix(in oklab, var(--accent) 34%, transparent), transparent 70%),
      radial-gradient(76% 54% at 50% 108%,
        color-mix(in oklab, var(--accent-soft) 52%, transparent), transparent 72%),
      var(--ground);
    color: var(--ink);
    font-family: "Thmanyah Sans", system-ui, sans-serif;
    text-align: center;
  }

  /* a faint grain of the site's binary margins, kept very quiet */
  body::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0 58px,
        color-mix(in oklab, var(--accent) 7%, transparent) 58px 59px);
    opacity: 0.5;
    pointer-events: none;
  }

  .inner { position: relative; z-index: 1; }

  h1 {
    font-family: "Thmanyah Display", Georgia, serif;
    font-weight: 300;
    font-size: 118px;
    line-height: 1.02;
    letter-spacing: -0.04em;
    margin-bottom: 30px;
  }
  h1 b { font-weight: 700; font-style: italic; color: var(--accent); }

  .ar {
    direction: rtl;
    font-family: "Thmanyah Display", Georgia, serif;
    font-weight: 300;
    font-size: 52px;
    line-height: 1.4;
    color: var(--ink-soft);
    margin-bottom: 86px;
  }

  .label {
    font-size: 25px;
    font-weight: 500;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: color-mix(in oklab, var(--accent) 62%, var(--ink-soft));
    margin-bottom: 30px;
  }

  /* the landing's pill, in the dark palette */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 30px 66px;
    border-radius: 999px;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--accent-ink);
    background: linear-gradient(135deg,
      color-mix(in oklab, var(--accent) 88%, #FFFFFF) 0%,
      var(--accent) 52%,
      var(--accent-soft) 100%);
    box-shadow:
      inset 0 2px 0 color-mix(in oklab, #FFFFFF 42%, transparent),
      0 30px 70px -22px color-mix(in oklab, var(--accent) 70%, transparent);
  }
</style>
</head>
<body>

<div class="inner">

  <h1>Get To Know <b>Maha</b></h1>

  <div class="ar">تعرّفوا أكثر على مها</div>

  <div class="label">The Portfolio</div>

  <div class="btn">Mahaalrashdi.com</div>

</div>

</body>
</html>
