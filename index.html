<!doctype html>

<!-- What LinkedIn, WhatsApp and X show when the link is shared.
     og:image has to be an absolute URL — a relative one is ignored,
     and the card falls back to a blank box. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://mahaalrashdi.com/">
<meta property="og:site_name" content="Inside Maha's World">
<meta property="og:title" content="مها الرشيدي — داخل عالم مها">
<meta property="og:description" content="مهندسة حاسب شغوفة بالذكاء الاصطناعي التوليدي والوكلاء الأذكياء. ملف أعمال تفاعلي ثنائي اللغة.">
<meta property="og:image" content="https://mahaalrashdi.com/public/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="مرحبًا، أنا مها — mahaalrashdi.com">
<meta property="og:locale" content="ar_AR">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/layout.css">
<link rel="stylesheet" href="src/styles/components.css">

<!-- Cloudflare Web Analytics. It sits in the head on purpose: build.py
     lifts only the document body into the single-file bundles, so
     keeping the beacon up here is what stops it riding along into a
     file meant to open from disk and make no network request at all. -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token": "5f09f9899ef24f74bb67e3600ee55edb"}'></script>
</head>

<canvas id="field" aria-hidden="true"></canvas>

    </button>
    <button class="chip" id="themeBtn" aria-label="Theme">◒</button>
  </div>
